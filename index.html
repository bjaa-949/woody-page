<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Juego 3D - Vista de Mapa</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: Arial, sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }
    </style>
</head>
<body>

    <div id="loading">Cargando mapa 3D...</div>
    <div id="canvas-container"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // --- Configuración Básica de la Escena ---
        const container = document.getElementById('canvas-container');
        const loadingEl = document.getElementById('loading');
        
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xa0a0a0);
        scene.fog = new THREE.Fog(0xa0a0a0, 10, 50);

        // --- Cámara ---
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 10); // Posición inicial alta para ver el mapa

        // --- Renderizador ---
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        // --- Controles de Cámara ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 - 0.05; // Evita que la cámara pase por debajo del suelo

        // --- Iluminación ---
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.5);
        hemiLight.position.set(0, 20, 0);
        scene.add(hemiLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
        dirLight.position.set(3, 10, 5);
        dirLight.castShadow = true;
        dirLight.shadow.camera.top = 10;
        dirLight.shadow.camera.bottom = -10;
        dirLight.shadow.camera.left = -10;
        dirLight.shadow.camera.right = 10;
        dirLight.shadow.camera.near = 0.1;
        dirLight.shadow.camera.far = 40;
        scene.add(dirLight);

        // Suelo gris de respaldo por si el mapa tarda en cargar
        const floorGeo = new THREE.PlaneGeometry(100, 100);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x808080, depthWrite: true });
        const ground = new THREE.Mesh(floorGeo, floorMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // --- Carga del Mapa .GLB desde tu GitHub ---
        const loader = new GLTFLoader();
        // URL Raw de tu repositorio
        const urlMapa = 'https://raw.githubusercontent.com/bjaa-949/woody/main/mapa.glb';

        loader.load(
            urlMapa,
            (gltf) => {
                const mapa = gltf.scene;
                
                // Habilitar sombras para los objetos del mapa
                mapa.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }
                });

                scene.add(mapa);
                
                // Ocultar el texto de carga
                loadingEl.style.opacity = 0;
                setTimeout(() => loadingEl.remove(), 500);
                
                console.log("¡Mapa cargado con éxito!");
            },
            (xhr) => {
                // Progreso de carga opcional en consola
                if (xhr.total > 0) {
                    const porciento = Math.round((xhr.loaded / xhr.total) * 100);
                    loadingEl.innerText = `Cargando mapa: ${porciento}%`;
                }
            },
            (error) => {
                console.error('Hubo un error cargando el mapa:', error);
                loadingEl.innerText = 'Error al cargar el mapa. Revisa la consola.';
            }
        );

        // --- Ajustar ventana en cambio de tamaño ---
        window.addEventListener('resize', onWindowResize);

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- Bucle de Animación ---
        function animate() {
            requestAnimationFrame(animate);

            // Requerido si controls.enableDamping = true
            controls.update(); 

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
