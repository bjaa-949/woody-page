<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Woody 3D Game - FBX desde Raíz</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; }
        #canvas-container { width: 100vw; height: 100vh; }
        #loading {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: white; font-family: sans-serif; font-size: 20px;
            background: rgba(0,0,0,0.8); padding: 20px; border-radius: 10px; pointer-events: none;
            text-align: center; line-height: 1.5; z-index: 10;
        }
        #controls-info {
            position: absolute; bottom: 20px; left: 20px; color: white;
            font-family: sans-serif; background: rgba(0,0,0,0.6); padding: 15px; border-radius: 8px;
            z-index: 10;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div id="loading">Cargando recursos del juego...<br><span id="status">Iniciando...</span></div>
    
    <div id="controls-info">
        <strong>Controles de Animación:</strong><br>
        Tecla 1: Reposo / Base<br>
        Tecla 2: Caminar<br>
        Tecla 3: Correr<br>
        Tecla 4: Caminar Agachado
    </div>

    <div id="canvas-container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- 1. CONFIGURACIÓN DE LA ESCENA ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xa0a0a0);
        scene.fog = new THREE.Fog(0xa0a0a0, 200, 1000);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 2000);
        camera.position.set(0, 150, 400); 

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.target.set(0, 100, 0);

        // --- 2. ILUMINACIÓN ---
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 3);
        hemiLight.position.set(0, 200, 0);
        scene.add(hemiLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 3);
        dirLight.position.set(100, 200, 100);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // --- 3. SUELO PLANO ---
        const floorGeo = new THREE.PlaneGeometry(2000, 2000);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x557a46, roughness: 0.8 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        const grid = new THREE.GridHelper(2000, 40, 0x000000, 0x000000);
        grid.material.opacity = 0.2;
        grid.material.transparent = true;
        scene.add(grid);

        // --- 4. CARGA DE MODELOS Y ANIMACIONES ---
        let mixer;
        const actions = {}; 
        let activeAction;
        const clock = new THREE.Clock();
        const loader = new FBXLoader();

        // CORRECCIÓN: Apuntamos directamente a la raíz de tu repositorio 'woody'
        const assetsBaseUrl = 'https://cdn.jsdelivr.net/gh/bjaa-949/woody@main/';

        const statusText = document.getElementById('status');

        // Paso A: Cargar personaje base
        statusText.innerText = "Cargando personaje base...";
        loader.load(`${assetsBaseUrl}personaje.fbx`, function (fbx) {
            
            fbx.scale.set(1, 1, 1); // Si Woody aparece gigante o diminuto, ajustaremos este valor después
            fbx.position.set(0, 0, 0);
            
            fbx.traverse(function (child) {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                }
            });

            scene.add(fbx);
            mixer = new THREE.AnimationMixer(fbx);

            // Guardar animación por defecto si 'personaje.fbx' ya incluye una
            if (fbx.animations.length > 0) {
                actions['reposo'] = mixer.clipAction(fbx.animations[0]);
                fadeToAction('reposo', 0);
            }

            // Paso B: Cargar animaciones externas desde la raíz del repositorio
            // Nota el uso de encodeURIComponent para el archivo con espacios 'caminar agachado.fbx'
            cargarAnimacionExterna('caminar', `${assetsBaseUrl}caminar.fbx`, () => {
                cargarAnimacionExterna('correr', `${assetsBaseUrl}correr.fbx`, () => {
                    cargarAnimacionExterna('agachado', `${assetsBaseUrl}caminar%20agachado.fbx`, () => {
                        
                        document.getElementById('loading').style.display = 'none';
                        
                        // Si el personaje base no tenía animación integrada, arrancamos con 'caminar'
                        if(!activeAction && actions['caminar']) {
                            fadeToAction('caminar', 0.5);
                        } else if (actions['reposo']) {
                            fadeToAction('reposo', 0.5);
                        }
                    });
                });
            });

        }, function (xhr) {
            if (xhr.total > 0) {
                const percent = Math.round((xhr.loaded / xhr.total) * 100);
                statusText.innerText = `Cargando personaje... ${percent}%`;
            }
        }, function (e) { 
            console.error("Error cargando el personaje base:", e); 
            statusText.innerText = "Error al cargar personaje.fbx";
        });

        // Función para inyectar animaciones externas
        function cargarAnimacionExterna(nombre, url, callback) {
            statusText.innerText = `Cargando animación: ${nombre}...`;
            loader.load(url, function (animFbx) {
                if (animFbx.animations.length > 0) {
                    const clip = animFbx.animations[0];
                    actions[nombre] = mixer.clipAction(clip);
                    console.log(`Animación '${nombre}' vinculada correctamente.`);
                } else {
                    console.warn(`El archivo ${nombre}.fbx no tiene tracks de animación.`);
                }
                callback();
            }, undefined, function(e) {
                console.error(`Error cargando animación ${nombre}:`, e);
                callback(); 
            });
        }

        // Función para hacer transiciones suaves entre animaciones
        function fadeToAction(name, duration = 0.5) {
            const nextAction = actions[name];
            if (!nextAction || nextAction === activeAction) return;

            if (activeAction) {
                activeAction.fadeOut(duration);
            }

            nextAction
                .reset()
                .setEffectiveTimeScale(1)
                .setEffectiveWeight(1)
                .fadeIn(duration)
                .play();

            activeAction = nextAction;
        }

        // --- 5. DETECTOR DE TECLADO ---
        window.addEventListener('keydown', (e) => {
            if (e.key === '1' && actions['reposo']) fadeToAction('reposo');
            if (e.key === '2' && actions['caminar']) fadeToAction('caminar');
            if (e.key === '3' && actions['correr']) fadeToAction('correr');
            if (e.key === '4' && actions['agachado']) fadeToAction('agachado');
        });

        // --- 6. GAME LOOP ---
        window.addEventListener('resize', onWindowResize);

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            if (mixer) mixer.update(delta);
            controls.update();
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
