<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Juego 3D - Vista de Mapa</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: Arial, sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            pointer-events: none;
            transition: opacity 0.5s ease;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 30px;
            border-radius: 8px;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="loading">Conectando con el repositorio...</div>
    <div id="canvas-container"></div>

    <!-- Importamos Three.js y sus complementos usando ES Modules -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // --- Configuración Básica de la Escena ---
        const container = document.getElementById('canvas-container');
        const loadingEl = document.getElementById('loading');
        
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xa0a0a0);
        scene.fog = new THREE.Fog(0xa0a0a0, 10, 100);

        // --- Cámara ---
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 15, 25); // Posición inicial para perspectiva global del mapa

        // --- Renderizador ---
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // --- Controles de Cámara ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 - 0.05; // Evita atravesar el suelo

        // --- Iluminación ---
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.5);
        hemiLight.position.set(0, 20, 0);
        scene.add(hemiLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(5, 20, 10);
        dirLight.castShadow = true;
        dirLight.shadow.camera.top = 25;
        dirLight.shadow.camera.bottom = -25;
        dirLight.shadow.camera.left = -25;
        dirLight.shadow.camera.right = 25;
        dirLight.shadow.camera.near = 0.1;
        dirLight.shadow.camera.far = 60;
        dirLight.shadow.mapSize.width = 2048; // Sombras de mejor calidad
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        // --- Carga del Mapa .GLB ---
        const loader = new GLTFLoader();
        
        // URL a través del CDN de jsDelivr para evitar errores de CORS/Formatos de GitHub
        const urlMapa = 'https://cdn.jsdelivr.net/gh/bjaa-949/woody@main/mapa.glb';

        loader.load(
            urlMapa,
            (gltf) => {
                const mapa = gltf.scene;
                
                // Habilitar sombras en todos los elementos del mapa de forma automática
                mapa.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }
                });

                scene.add(mapa);
                
                // Animación de salida para el texto de carga
                loadingEl.style.opacity = 0;
                setTimeout(() => loadingEl.remove(), 500);
                
                console.log("¡Mapa 3D cargado correctamente desde el repositorio!");
            },
            (xhr) => {
                // Muestra el progreso real de descarga del archivo
                if (xhr.total > 0) {
                    const porciento = Math.round((xhr.loaded / xhr.total) * 100);
                    loadingEl.innerText = `Cargando mapa: ${porciento}%`;
                } else {
                    loadingEl.innerText = `Descargando datos del mapa...`;
                }
            },
            (error) => {
                console.error('Error al procesar el GLTF:', error);
                loadingEl.innerText = 'Error al procesar el archivo del mapa.';
                loadingEl.style.background = 'rgba(255, 0, 0, 0.8)';
            }
        );

        // --- Ajustar el lienzo si cambia el tamaño de la pantalla ---
        window.addEventListener('resize', onWindowResize);

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- Bucle de Renderizado ---
        function animate() {
            requestAnimationFrame(animate);

            // Actualiza las físicas suaves del movimiento de cámara
            controls.update(); 

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
